<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GSAP Green Box Animation</title>

  <!-- GSAP CDN -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      overflow: hidden;

      color: white;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;

      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 120px;
      height: 120px;
      background: limegreen;
      border-radius: 16px;
    }

     h1 {
      font-size: 3rem;
    }
  </style>
</head>
<body>

    <h1 class="title">Hello GSAP</h1>
  <div class="box"></div>

  <script>
    gsap.from(".title", {
      y: -100,
      opacity: 0,
      duration: 1.5,
      ease: "bounce.out"
    });


    gsap.to(".box", {
      x: 250,
      rotation: 360,
      duration: 2,
      repeat: -1,
      yoyo: true,
      ease: "power2.inOut"
    });
  </script>

</body>
</html>
